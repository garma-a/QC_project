  url: "{{baseUrl}}/auth/forgot-password/reset"
  body:
    type: json
    data: |-
      {
        "email":"g@gmail.com",
        "newPassword":"123456789"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
